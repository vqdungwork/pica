# ci.yml — this repository submitting to its own rule.
#
# pica requires every project it validates to run its checks in a pipeline, and until now
# ran its own two suites only when somebody remembered to. impl-check has asserted
# `ci-pipeline` against other people's repositories since 0.8.0 while this one had no
# workflow at all. That is the gap this closes.
#
# Two suites, and the second is the one that matters:
#
#   1. validate-packages   the manifests, the ownership map, the links resolve
#   2. mutate --fixture    every check is seen to FAIL on the defect it was written for
#
# The README's claim — "every one has been seen to fail on the defect it was written for" —
# is worth exactly as much as the last run of the mutation suite. Now that is every push.
#
# Both exit non-zero on findings, so a red run means a real defect and not a warning
# somebody can wave through.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The two suites import Node builtins only. Playwright is not for them — it is for
      # the FIXTURE. mutate.mjs produces the capture by running capture-html-reference.mjs,
      # and without a browser four capture-reading mutations report SKIPPED:
      # verify-html·direction, contrast-check·exemption-used, coverage-check·uc-covered
      # and spacing-check·off-scale.
      #
      # The first run of this workflow did exactly that — 85 caught · 0 missed · 4 skipped,
      # green, while proving four fewer checks than the machine it was written on. The
      # suite's own words: a skipped mutation is not a passed one. A green tick over four
      # unproven checks is the failure mode this whole workflow exists to end, so the
      # browser is installed and the run is held to 89.
      - name: install playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: validate packages
        run: node scripts/validate-packages.mjs

      # A check must report on the project it was pointed at, not on whichever repository
      # encloses it. impl-check did the latter until 1.2.3, and its credential scan passed
      # having scanned nothing.
      - name: scope test
        run: node scripts/scope-test.mjs

      # The gate is folded into the run rather than repeating it: mutate.mjs exits 0 with
      # mutations SKIPPED, so a green tick alone does not mean every check was proven.
      - name: mutation suite
        run: |
          set -o pipefail
          node scripts/mutate.mjs --fixture | tee mutate.log
          if grep -qE '[1-9][0-9]* skipped' mutate.log; then
            echo "::error::a skipped mutation is not a passed one — see the skip lines above"
            exit 1
          fi

# Deliberately NOT run here: the mutation suite against examples/approvals.
#
# impl-check's branch-age reads the git branches of the ENCLOSING repository, and the
# worked example is not its own repo — so pointed at examples/approvals it reports on
# pica's own stale branches instead. It currently fails locally for that reason alone
# (0.8.0, packaging-restructure, role-agents-and-the-build, v0.2.0) while a default
# Actions checkout fetches one ref and would quietly pass.
#
# A suite whose result depends on which branches the runner happened to fetch proves
# nothing. --fixture generates its own clean project and is the same everywhere. Fix
# branch-age to scope to the project directory and this line can change.
